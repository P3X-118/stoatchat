name: Docker Test & Publish

on:
  push:
    branches: [sgc]
    tags:
      - "*"
  pull_request:
    paths:
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Base image: built once per architecture in parallel ----
  base:
    name: Base (${{ matrix.platform }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: legitservices/stoked-base:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max

  base-manifest:
    name: Base manifest
    needs: base
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create -t legitservices/stoked-base:latest \
            legitservices/stoked-base:latest-amd64 \
            legitservices/stoked-base:latest-arm64

  # ---- All services: 8 services × 2 arches = 16 parallel jobs ----
  services:
    name: ${{ matrix.service.name }} (${{ matrix.platform }})
    needs: base-manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        service:
          - { name: api,           file: crates/delta/Dockerfile }
          - { name: events,        file: crates/bonfire/Dockerfile }
          - { name: file-server,   file: crates/services/autumn/Dockerfile }
          - { name: proxy,         file: crates/services/january/Dockerfile }
          - { name: gifbox,        file: crates/services/gifbox/Dockerfile }
          - { name: crond,         file: crates/daemons/crond/Dockerfile }
          - { name: pushd,         file: crates/daemons/pushd/Dockerfile }
          - { name: voice-ingress, file: crates/daemons/voice-ingress/Dockerfile }
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: legitservices/stoked-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch }}
            type=sha,prefix=sha-,suffix=-${{ matrix.arch }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          file: ${{ matrix.service.file }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=legitservices/stoked-base:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.service.name }}-${{ matrix.arch }},mode=max

  # ---- Combine per-arch images into multi-arch manifests ----
  manifest:
    name: ${{ matrix.service }} manifest
    needs: services
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        service: [api, events, file-server, proxy, gifbox, crond, pushd, voice-ingress]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute base tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Strip leading 'v' from semver tags
            TAG="${{ github.ref_name }}"
            echo "tag=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - name: Create multi-arch manifest
        run: |
          IMAGE=legitservices/stoked-${{ matrix.service }}
          TAG=${{ steps.tag.outputs.tag }}
          docker buildx imagetools create -t $IMAGE:$TAG \
            $IMAGE:$TAG-amd64 \
            $IMAGE:$TAG-arm64
